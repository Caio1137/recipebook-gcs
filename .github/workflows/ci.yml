name: CI - RecipeBook

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-backend:
    name: "Build Backend (Spring Boot + Java 17)"
    runs-on: windows-latest

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Configurar Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: "Build e testes com Maven"
        run: .\mvnw.cmd verify --no-transfer-progress
        working-directory: backend

  build-frontend:
    name: "Build Frontend (Angular + Node 20)"
    runs-on: windows-latest

    steps:
      - name: "Checkout do codigo"
        uses: actions/checkout@v4

      - name: "Configurar Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "Instalar dependencias"
        run: npm.cmd install --no-package-lock
        working-directory: frontend

      - name: "Build Angular (prod)"
        run: npm.cmd run build
        working-directory: frontend
